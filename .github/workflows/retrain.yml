name: Retrain

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even when no drift report flags drift"
        type: boolean
        default: true
      model:
        description: "Candidate model"
        type: choice
        options: [gradient_boosting, baseline]
        default: gradient_boosting
      min_improvement:
        description: "Minimum relative RMSE improvement to promote (0.01 = 1%)"
        type: string
        default: "0.0"

permissions:
  contents: read

jobs:
  retrain:
    name: Train candidate and apply promotion gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing
          POSTGRES_DB: housing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing -d housing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://housing:housing@localhost:5432/housing
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Prepare data and train the champion
        run: |
          python scripts/download_data.py
          python scripts/train.py --model gradient_boosting --set-current
      - name: Retrain and apply the promotion gate
        run: >
          python scripts/retrain.py
          --model ${{ inputs.model }}
          --min-improvement ${{ inputs.min_improvement }}
          ${{ inputs.force && '--force' || '' }}
          --json outcome/retrain.json
      - name: Write job summary
        run: python scripts/retrain_summary.py outcome/retrain.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: retraining-outcome
          path: |
            outcome/retrain.json
            models/**/metadata.json
          if-no-files-found: error
