name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing
          POSTGRES_DB: housing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housing -d housing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://housing:housing@localhost:5432/housing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/unit tests/integration -m "not dataset" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  quality-gate:
    name: Train and quality gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/download_data.py
      - run: pytest tests/integration -m dataset -v
      - run: pytest tests/model -v
      - run: python scripts/train.py --model all --set-current
      - uses: actions/upload-artifact@v7
        with:
          name: model-metadata
          path: models/**/metadata.json
          if-no-files-found: error

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build --tag california-housing-mlops:latest .
      - run: docker run --rm california-housing-mlops:latest python -c "import housing_mlops.api.main; print('import ok')"
      - run: docker run --rm california-housing-mlops:latest id -u | grep -qv '^0$'
      - name: Start the stack and smoke test the API
        run: |
          docker compose up -d --wait --no-build db api
          curl --fail --silent http://localhost:8000/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['database']=='ok', h"
          curl --silent --output /dev/null --write-out '%{http_code}\n' -X POST http://localhost:8000/predict -H 'Content-Type: application/json' -d '{"MedInc":8.3,"HouseAge":41,"AveRooms":6.98,"AveBedrms":1.02,"Population":322,"AveOccup":2.56,"Latitude":37.88,"Longitude":-122.23}' | grep -E '^(200|503)$'
      - if: always()
        run: docker compose logs --no-color api | tail -50; docker compose down -v
