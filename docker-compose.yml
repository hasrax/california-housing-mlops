services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: housing
      POSTGRES_DB: housing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    image: california-housing-mlops:latest
    environment:
      DATABASE_URL: postgresql+psycopg://housing:housing@db:5432/housing
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: california-housing-mlops:latest
    command: ["python", "scripts/run_dashboard.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://housing:housing@db:5432/housing
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
