[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-mlops"
version = "0.1.0"
description = "House price prediction service with drift monitoring and automated retraining"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pandera==0.36.0",
    "mlflow==3.18.0",
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "httpx==0.28.1",
    "streamlit==1.67.0",
    "plotly==7.1.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.15",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"
filterwarnings = [
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
markers = [
    "integration: needs a running PostgreSQL (deselected from the unit job)",
    "dataset: needs the cached California Housing dataset in data/raw",
]

[tool.coverage.run]
source = ["housing_mlops"]
branch = true
omit = ["src/housing_mlops/dashboard/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
